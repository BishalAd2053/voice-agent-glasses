workflows:
  ios-debug-unsigned:
    name: iOS debug build (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_SCHEME: VoiceAgentGlasses
        XCODE_WORKSPACE: VoiceAgentGlasses.xcodeproj
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME"

      - name: Build for simulator (unsigned, fastest sanity check)
        script: |
          set -o pipefail
          xcodebuild \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty

    artifacts:
      - build/ios/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app

  ios-unsigned-ipa:
    name: iOS device IPA (unsigned, for AltStore)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_SCHEME: VoiceAgentGlasses
        XCODE_PROJECT: VoiceAgentGlasses.xcodeproj
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Archive for iOS device, no signing
        script: |
          set -o pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/VoiceAgentGlasses.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO | xcpretty

      - name: Package unsigned IPA for AltStore
        script: |
          set -e
          cd build
          mkdir -p Payload
          cp -R VoiceAgentGlasses.xcarchive/Products/Applications/VoiceAgentGlasses.app Payload/
          # Strip any leftover signature so AltStore re-signs cleanly.
          rm -rf Payload/VoiceAgentGlasses.app/_CodeSignature 2>/dev/null || true
          zip -qr VoiceAgentGlasses-unsigned.ipa Payload
          ls -lh VoiceAgentGlasses-unsigned.ipa

    artifacts:
      - build/VoiceAgentGlasses-unsigned.ipa

  ios-device-ad-hoc:
    name: iOS device build (signed, ad-hoc)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Enable this workflow once you've added an Apple Developer account and
    # signing files in Codemagic → Teams → Code signing identities.
    # Comment out the `triggering` block to keep it manual-only for now.
    environment:
      vars:
        XCODE_SCHEME: VoiceAgentGlasses
        XCODE_WORKSPACE: VoiceAgentGlasses.xcodeproj
        BUNDLE_ID: com.voiceagent.glasses
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.voiceagent.glasses

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME"
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Archive
        script: |
          xcode-project build-ipa \
            --project "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
